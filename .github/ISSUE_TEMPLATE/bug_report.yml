name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please don't report security vulnerabilities
        here — see our [Security policy](https://github.com/ForrestLasiter/warden/security/policy).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact command(s) you ran, or what you clicked in the dashboard.
      placeholder: |
        1. warden scan C:\...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Warden version
      description: Output of `warden version` (or the release/binary you used).
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install Warden?
      options:
        - Release binary
        - From source (pip install -e .)
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste any error text or a scan report (`--json`). This is automatically formatted as code.
      render: shell
