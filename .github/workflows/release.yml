name: Build release binaries

# Push a version tag (e.g. v0.1.0) to build standalone binaries for Windows,
# Linux, and macOS and attach them to the matching GitHub Release.
# You can also run it manually (Actions tab -> Run workflow) to get artifacts
# without cutting a release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bin: dist/warden.exe
            asset: warden-windows-x64.exe
          - os: ubuntu-latest
            bin: dist/warden
            asset: warden-linux-x64
          - os: ubuntu-24.04-arm
            bin: dist/warden
            asset: warden-linux-arm64
          - os: macos-latest
            bin: dist/warden
            asset: warden-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller

      - name: Build binary
        shell: bash
        run: pyinstaller packaging/warden.spec --distpath dist --workpath build/pyi --noconfirm

      - name: Smoke-test the binary
        shell: bash
        run: |
          "${{ matrix.bin }}" version
          "${{ matrix.bin }}" status

      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.bin }}" "out/${{ matrix.asset }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}

      - name: Attach binary to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/${{ matrix.asset }}
          fail_on_unmatched_files: true

  # Publish one SHA256SUMS covering every binary, so users (and the installers)
  # can verify what they downloaded. Runs after all binaries are built.
  checksums:
    name: Publish checksums
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum warden-* | tee SHA256SUMS
      - name: Attach checksums + notes to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SHA256SUMS
          body: |
            Standalone Warden binaries — no Python needed.

            | Platform | File |
            | --- | --- |
            | Windows x64 | `warden-windows-x64.exe` |
            | Linux x64 | `warden-linux-x64` |
            | Linux ARM64 | `warden-linux-arm64` |
            | macOS (Apple Silicon) | `warden-macos-arm64` |

            Verify your download against `SHA256SUMS` (the one-line installers do
            this automatically). On Linux/macOS: `chmod +x warden-*` then run it.
            On Windows, SmartScreen may warn about an unsigned binary the first
            time. ClamAV is optional; YARA rules and heuristics work out of the box.
