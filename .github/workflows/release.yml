name: Build release binaries

# Push a version tag (e.g. v0.1.0) to build standalone binaries for Windows,
# Linux, and macOS and attach them to the matching GitHub Release.
# You can also run it manually (Actions tab -> Run workflow) to get artifacts
# without cutting a release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Build jobs only read the repository. The single publishing job at the end is
# the only one that can write to the release.
permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bin: dist/warden.exe
            asset: warden-windows-x64.exe
          - os: ubuntu-latest
            bin: dist/warden
            asset: warden-linux-x64
          - os: ubuntu-24.04-arm
            bin: dist/warden
            asset: warden-linux-arm64
          - os: macos-latest          # Apple Silicon
            bin: dist/warden
            asset: warden-macos-arm64
          - os: macos-15-intel        # Intel Macs
            bin: dist/warden
            asset: warden-macos-x64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.asset }}" = "warden-macos-x64" ]; then
            # The crypto library publishes no Intel-macOS wheel any more, so pip
            # compiles it here (from the hash-locked sdist). Link OpenSSL
            # STATICALLY: a dynamic link would name libssl.3.dylib, which collides
            # inside the bundle with the different libssl.3.dylib Python itself
            # ships - and the binding then fails to load.
            export OPENSSL_STATIC=1
            OPENSSL_DIR="$(brew --prefix openssl@3)"
            export OPENSSL_DIR
            echo "cryptography will be built against static $("$OPENSSL_DIR/bin/openssl" version)"
          fi
          # Hash-locked, version-pinned deps (incl. PyInstaller) so a compromised
          # or broken upstream release can't enter a published binary.
          pip install --require-hashes -r requirements-release.txt
          pip install --no-deps .

      - name: Build binary
        shell: bash
        run: pyinstaller packaging/warden.spec --distpath dist --workpath build/pyi --noconfirm

      - name: Smoke-test the binary
        shell: bash
        run: |
          BIN="${{ matrix.bin }}"
          "$BIN" version
          "$BIN" status
          # Offline + no telemetry by default, and the report renders.
          "$BIN" --offline privacy --json > /dev/null
          # The bundled crypto library loads (rule-pack signatures, quarantine encryption).
          tmp="$(mktemp -d)"
          # (OPENSSL_MODULES points nowhere to mimic a machine that has none of
          # the build host's OpenSSL files.)
          OPENSSL_MODULES="$tmp/no-such-dir" "$BIN" rules keygen smoke --out "$tmp"
          test -s "$tmp/smoke.pub"
          # Executable parsing + signature lookup work on the binary itself.
          "$BIN" inspect "$BIN" --json > /dev/null
          # A clean file scans clean (exit 0) through every engine.
          echo "hello" > "$tmp/clean.txt"
          "$BIN" scan "$tmp/clean.txt"
          # ...also when output is not a UTF-8 terminal (redirected / legacy console).
          PYTHONIOENCODING=cp1252 "$BIN" scan "$tmp/clean.txt" > /dev/null
          # The third-party license notices were baked into this binary.
          "$BIN" licenses --full > "$tmp/notices.txt"
          grep -q "THIRD-PARTY SOFTWARE NOTICES" "$tmp/notices.txt"
          grep -q "PyInstaller bootloader" "$tmp/notices.txt"
          grep -q "YARA-X Authors" "$tmp/notices.txt"
          # The scans above were recorded, and the audit chain verifies.
          "$BIN" audit verify
          "$BIN" posture --json > /dev/null

      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.bin }}" "out/${{ matrix.asset }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}

  # Publish - all or nothing. Nothing is attached to the release until EVERY
  # platform has built and passed its smoke test; then the binaries go up
  # together with their checksums, Sigstore signature, SLSA provenance and SBOMs.
  # A partial build therefore can never produce a "latest" release that is
  # missing SHA256SUMS (which the installers, correctly, refuse to install from).
  checksums:
    name: Publish (checksums, signatures, SBOM)
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # attach assets to the release
      id-token: write        # Sigstore keyless signing + provenance (OIDC)
      attestations: write    # build provenance attestations
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum warden-* | tee SHA256SUMS

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign SHA256SUMS (keyless)
        run: |
          cd dist
          cosign sign-blob --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            SHA256SUMS

      - name: SLSA build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/warden-*'

      - name: Generate SBOM (SPDX + CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/warden.spdx.json

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/warden.cdx.json

      - name: Attach checksums, signatures, SBOM + notes to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          fail_on_unmatched_files: true
          files: |
            dist/warden-*
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
            dist/SHA256SUMS.pem
            dist/warden.spdx.json
            dist/warden.cdx.json
          body: |
            Standalone Warden binaries — no Python needed.

            | Platform | File |
            | --- | --- |
            | Windows x64 | `warden-windows-x64.exe` |
            | Linux x64 | `warden-linux-x64` |
            | Linux ARM64 | `warden-linux-arm64` |
            | macOS (Apple Silicon) | `warden-macos-arm64` |

            **Verify your download** — `SHA256SUMS` covers every binary (the
            one-line installers check it automatically). The checksums file is
            also **Sigstore-signed** (`SHA256SUMS.sig` + `SHA256SUMS.pem`) and the
            binaries carry **SLSA build provenance**. See
            [docs/VERIFY.md](https://github.com/ForrestLasiter/warden/blob/main/docs/VERIFY.md).
            SBOMs: `warden.spdx.json`, `warden.cdx.json`.

            On Linux/macOS: `chmod +x warden-*` then run it. On Windows,
            SmartScreen may warn about an unsigned binary the first time (Warden
            is not code-signed). ClamAV is optional; YARA rules and heuristics
            work out of the box.
