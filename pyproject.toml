[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warden-scanner"
version = "0.3.3"
description = "Open-source, on-demand malware scanner (YARA + heuristics + hash reputation + optional ClamAV)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Forrest Lasiter" }]
keywords = ["malware", "antivirus", "yara", "security", "scanner", "clamav"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "yara-x>=0.10",
    "typer>=0.12",
    "rich>=13.0",
    "pefile>=2023.2.7",
    "psutil>=5.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
warden = "warden.cli:main"

[project.urls]
Homepage = "https://github.com/ForrestLasiter/warden"
Issues = "https://github.com/ForrestLasiter/warden/issues"

[tool.setuptools.packages.find]
include = ["warden*"]

[tool.setuptools.package-data]
warden = ["rules/*.yar", "rules/*.yara", "gui/static/*"]
