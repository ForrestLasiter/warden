[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warden-scanner"
version = "0.5.1"
description = "Open-source, on-demand malware scanner (YARA + heuristics + hash reputation + optional ClamAV)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Forrest Lasiter" }]
keywords = ["malware", "antivirus", "yara", "security", "scanner", "clamav"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "yara-x>=0.10",
    "typer>=0.12",
    "rich>=13.0",
    "pefile>=2023.2.7",
    "psutil>=5.9",
    "httpx>=0.27",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",
    "ruff>=0.6",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "mypy>=1.10",
]

[project.scripts]
warden = "warden.cli:main"

[project.urls]
Homepage = "https://github.com/ForrestLasiter/warden"
Issues = "https://github.com/ForrestLasiter/warden/issues"

[tool.setuptools.packages.find]
include = ["warden*"]

[tool.setuptools.package-data]
warden = ["rules/*.yar", "rules/*.yara", "gui/static/*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = [
    "E501",   # line length - prose/comments run long; not worth churn
    "B008",   # function call in default arg - Typer REQUIRES Option()/Argument()
    "E741",   # ambiguous variable name (l/I/O) - rare, benign here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F841", "B011"]
# The CLI deliberately converts validation errors into clean `raise typer.Exit`
# for the user; exception chaining there adds noise rather than clarity.
"warden/cli.py" = ["B904"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
# Pragmatic: catch obvious type errors without demanding full annotation.
check_untyped_defs = false
disable_error_code = ["annotation-unchecked"]

[tool.coverage.run]
source = ["warden"]
omit = ["warden/gui/static/*"]

[tool.bandit]
# B404/B603/B607: we call trusted system tools (schtasks, powershell, clamav,
#   crontab) with argv lists and absolute paths - reviewed, not shell=True.
# B108: "/tmp" is a directory we *scan* (sweep), not an insecure temp file we create.
skips = ["B404", "B603", "B607", "B110", "B112", "B108"]
